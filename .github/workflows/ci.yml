name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # the suite is designed network-free; Node is preinstalled on the
      # runner, so the inline-JS syntax gate runs too
      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=no 2>&1 | tee pytest_out.txt
          code=${PIPESTATUS[0]}
          # surface every failing test as an annotation (readable via API)
          grep -E "^(FAILED|ERROR)" pytest_out.txt | head -25 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $code

      - name: Syntax-check the inline dashboard JS
        run: python tools/check_dashboard_js.py

      # explicitly advisory: findings are printed but cannot fail the build
      - name: Security lint (bandit)
        continue-on-error: true
        run: |
          pip install bandit
          bandit -q -ll -x backups,_archive -r .

      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2020-117
