name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # the suite is designed network-free; Node is preinstalled on the
      # runner, so the inline-JS syntax gate runs too
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Syntax-check the inline dashboard JS
        run: python tools/check_dashboard_js.py

      - name: Security lint (bandit)
        run: |
          pip install bandit
          bandit -q -ll -x backups -r . || true

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2020-117 || true
